<html lang="en">
<div th:replace="fragments/header :: header"></div>

<table>
<thead>
<tr>
    <th>
        Team Name
    </th>
    <th>
        Points
    </th>
</tr>
</thead>
<tbody id = "teamTable">
<tr th:each="team: ${teams}">
    <td>
        <a th:text="${team.id}" th:href="@{/teams/{id}(id=${team.id})}"></a>
    </td>
    <td th:text="${team.teamName}"></td>
</tr>


</tbody>

</table>
<head> <title> Teams </title></head>
<body>This is where the teams display page will be </body>
</html>
