<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Game List</title>
</head>
<body>
<div th:replace="fragments/header :: header"></div>
<table border="1" style="width:300px;margin-left: auto; margin-right: auto;margin-top:20px">
  <thead>
  <tr>
    <th>
      Home Team
    </th>
    <th>
      Away Team
    </th>
    <th>
      Home Goals
    </th>
    <th>
      Away Goals
    </th>
    <th>
      Winner
    </th>
  </tr>
  </thead>
  <tbody id = "teamTable">
  <tr th:each="game: ${games}">
    <td th:text="${game.homeTeam}"></td>
    <td th:text="${game.awayTeam}"></td>
    <td th:text="${game.homeGoals}"></td>
    <td th:text="${game.awayGoals}"></td>
    <td th:text="${winner[game.gameId]}"></td>
  </tr>


  </tbody>

</table>

</body>
</html>
